<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clinic Management System - Select Role</title>

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><text y=%220.9em%22 font-size=%2290%22>🏥</text></svg>"
    >

    <!-- Global CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="./assets/css/index.css">

    <!-- Normal JavaScript files -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>

    <!-- Reusable components -->
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>

<body>

<div class="container">

    <div class="wrapper">

        <!-- Dynamic Header -->
        <div id="header"></div>

        <!-- Main Content -->
        <main class="main-content">

            <h2>Select Your Role</h2>

            <div class="role-button-group">

                <button
                    type="button"
                    class="dashboard-btn"
                    id="role-admin"
                >
                    <span class="icon">🛡️</span>
                    <span>Admin</span>
                </button>

                <button
                    type="button"
                    class="dashboard-btn"
                    id="role-doctor"
                >
                    <span class="icon">🩺</span>
                    <span>Doctor</span>
                </button>

                <button
                    type="button"
                    class="dashboard-btn"
                    id="role-patient"
                >
                    <span class="icon">👤</span>
                    <span>Patient</span>
                </button>

            </div>

        </main>

        <!-- Dynamic Footer -->
        <div id="footer"></div>

    </div>

</div>


<!-- Login / Signup Modal -->
<div
    id="modal"
    class="modal"
    style="display: none;"
    aria-hidden="true"
>

    <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
    >

        <button
            type="button"
            id="closeModal"
            class="close"
            aria-label="Close modal"
        >
            &times;
        </button>

        <div id="modal-body"></div>

    </div>

</div>


<!--
    Authentication service must be a module because it uses ES module imports.
-->
<script
    type="module"
    src="./js/services/index.js"
></script>

</body>
</html>
