name: Lint Frontend

on: [push, pull_request]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    name: Lint Thymeleaf HTML, CSS, and JS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint eslint

      # Checks Thymeleaf template HTML layouts
      - name: Lint HTML
        run: |
          htmlhint "src/main/resources/templates/**/*.html" || true
          htmlhint "src/main/resources/static/**/*.html" || true

      # Checks CSS styles in static directory
      - name: Lint CSS
        run: stylelint "src/main/resources/static/**/*.css" || true

      # Checks JavaScript behaviors in static directory
      - name: Lint JS
        run: eslint "src/main/resources/static/**/*.js" || true
