name: Lint Dockerfiles

on: [push, pull_request]

jobs:
  dockerlint:
    runs-on: ubuntu-latest
    name: Lint Dockerfiles
    steps:
      - uses: actions/checkout@v3

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/Dockerfile


		  
#You can now use Git to commit and push these files. Once pushed, navigate to your repository on GitHub and select the Actions tab to watch your pipeline execute concurrently!
